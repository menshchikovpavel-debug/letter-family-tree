<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Letter Map</title>

<style>
  :root{
    --paper:#f7f7f7; --card:#ffffff; --ink:#1c1c1c;
    --ink-70:rgba(28,28,28,.70); --ink-45:rgba(28,28,28,.45);
    --ink-28:rgba(28,28,28,.28); --rule:rgba(28,28,28,.30);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1c1c1c; --card:#262626; --ink:#eeeeee;
      --ink-70:rgba(238,238,238,.70); --ink-45:rgba(238,238,238,.45);
      --ink-28:rgba(238,238,238,.28); --rule:rgba(238,238,238,.32);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1c1c1c; --card:#262626; --ink:#eeeeee;
    --ink-70:rgba(238,238,238,.70); --ink-45:rgba(238,238,238,.45);
    --ink-28:rgba(238,238,238,.28); --rule:rgba(238,238,238,.32);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"EB Garamond",Georgia,"Times New Roman",serif;
    font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }

  #stage{
    position:fixed;inset:0;overflow:hidden;
    cursor:grab;touch-action:none;
  }
  #stage.grabbing{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #world svg.lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  #world svg.lines path{fill:none;stroke:var(--rule);stroke-width:1.2}
  #world svg.lines path.hedge{stroke-dasharray:3 5}

  .ttl{
    position:absolute;white-space:nowrap;pointer-events:none;
    font-size:62px;line-height:1;color:var(--ink-28);letter-spacing:.02em;
  }
  .ttl i{display:block;font-size:14px;font-style:normal;letter-spacing:.16em;
    text-transform:uppercase;margin-top:12px;color:var(--ink-28)}

  .node{
    position:absolute;display:flex;flex-direction:column;align-items:center;
    background:none;border:0;padding:0;margin:0;cursor:pointer;
    color:var(--ink);font-family:inherit;text-align:center;
  }
  .node:focus{outline:none}
  .node .pair{display:flex;align-items:center;justify-content:center;gap:9px;height:40px}
  .node .tx{min-width:0;width:100%;margin-top:7px}
  .gl{flex:0 0 auto;display:flex;align-items:center;justify-content:center;line-height:1}
  .gl.none::after{content:"";display:block;width:62%;height:1px;background:var(--rule)}
  .gl svg{display:block;width:100%;height:100%}
  .gl svg path{fill:none;stroke:currentColor;stroke-width:var(--sw,6);stroke-linecap:round;stroke-linejoin:round}
  .node .nm{display:block;line-height:1.16;font-size:13px}
  .node .dt{display:block;color:var(--ink-45);line-height:1.25;font-size:10px;margin-top:1px}

  .band{
    position:absolute;white-space:nowrap;pointer-events:none;
    font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-28);
  }
  .band i{
    font-style:normal;text-transform:none;letter-spacing:.04em;
    font-size:12px;margin-left:10px;color:var(--ink-28);
  }
  .node:hover .nm,.node[aria-expanded="true"] .nm{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
  #world.dim .node:not([aria-expanded="true"]){opacity:.4}

  #head{
    position:fixed;left:26px;top:18px;z-index:20;width:min(1040px,calc(100vw - 52px));
    pointer-events:none;
  }
  #head h1{font-weight:400;font-size:22px;line-height:1.1;margin:0 0 3px}
  #head p{margin:0;color:var(--ink-45);font-size:13.5px;line-height:1.35;max-width:72ch}
  #head p.small{font-size:12px;margin-top:3px;color:var(--ink-28)}
  #head a{pointer-events:auto;color:var(--ink-70);text-decoration:underline;text-underline-offset:3px}

  #filter{pointer-events:auto;margin:9px 0 1px;display:flex;flex-wrap:wrap;align-items:flex-end}
  #filter label{
    display:flex;flex-direction:column;align-items:center;cursor:pointer;
    width:70px;margin:0 1px 7px;user-select:none;color:var(--ink-45);
  }
  #filter .fg{
    display:flex;align-items:center;justify-content:center;gap:4px;
    height:23px;font-size:19px;line-height:1;color:var(--ink-28);
  }
  #filter .fn{
    font-size:9.5px;line-height:1.18;margin-top:3px;text-align:center;
  }
  #filter .fb{
    margin-top:4px;width:10px;height:10px;border:1px solid var(--ink-45);flex:0 0 auto;
  }
  #filter label.on{color:var(--ink)}
  #filter label.on .fg{color:var(--ink)}
  #filter label.on .fb{background:var(--ink);border-color:var(--ink)}
  #filter label:hover{color:var(--ink-70)}
  #filter label:hover .fg{color:var(--ink-45)}
  #filter input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
  #filter .sep{
    font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-28);
    align-self:center;margin:0 8px 7px 10px;
  }
  @media (max-width:700px){
    #filter label{width:56px;margin-bottom:6px}
    #filter .fg{font-size:16px;height:19px}
    #filter .fn{font-size:8.5px}
  }
  @media (max-width:700px){
    #head{left:14px;top:10px;width:calc(100vw - 28px)}
    #head h1{font-size:20px}
    #head p{font-size:13px}
    #filter label{font-size:12.5px;margin-right:12px}
  }

  #pop{
    position:fixed;z-index:40;display:none;
    width:368px;max-width:calc(100vw - 28px);
    max-height:calc(100vh - 28px);overflow-y:auto;
    background:var(--card);padding:20px 24px 22px;
    scrollbar-width:thin;scrollbar-color:var(--ink-28) transparent;
  }
  #pop.on{display:block}
  #pop .pg{height:66px;margin-bottom:13px;display:flex;align-items:flex-end}
  #pop .pg .gl{align-items:flex-end}
  #pop .pn{color:var(--ink)}
  #pop .pt{font-size:21px;line-height:1.2;margin:0 0 2px}
  #pop .pl{font-size:16px;line-height:1.2;margin:0 0 7px;color:var(--ink-70);font-style:italic}
  #pop .pm{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-45);margin:0 0 11px}
  #pop .pd{font-size:16px;line-height:1.5;color:var(--ink-70);margin:0}
  #pop .pd + .pd{margin-top:9px}
  #pop .pu{font-size:13px;letter-spacing:.04em;color:var(--ink-45);margin:11px 0 0;font-variant-numeric:tabular-nums}
  #pop .ps{margin:13px 0 0;font-size:14px}
  #pop .ps a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;display:inline-block;margin-right:14px}
  #pop .pclose{margin-top:14px;background:none;border:0;padding:0;font-family:inherit;font-size:14px;color:var(--ink-45);text-decoration:underline;text-underline-offset:3px;cursor:pointer;display:none}
  body.touch #pop .pclose{display:block}

  .f-cun{font-family:"Noto Sans Cuneiform",serif}
  .f-egy{font-family:"Noto Sans Egyptian Hieroglyphs",serif}
  .f-uga{font-family:"Noto Sans Ugaritic",serif}
  .f-phn{font-family:"Noto Sans Phoenician",serif}
  .f-osa{font-family:"Noto Sans Old South Arabian",serif}
  .f-eth{font-family:"Noto Sans Ethiopic",serif}
  .f-sam{font-family:"Noto Sans Samaritan",serif}
  .f-ara{font-family:"Noto Sans Imperial Aramaic",serif}
  .f-heb{font-family:"Noto Sans Hebrew",serif}
  .f-nab{font-family:"Noto Sans Nabataean",serif}
  .f-arb{font-family:"Noto Sans Arabic",serif}
  .f-pal{font-family:"Noto Sans Palmyrene",serif}
  .f-syr{font-family:"Noto Sans Syriac",serif}
  .f-man{font-family:"Noto Sans Mandaic",serif}
  .f-sog{font-family:"Noto Sans Sogdian",serif}
  .f-uyg{font-family:"Noto Serif Old Uyghur",serif}
  .f-mon{font-family:"Noto Sans Mongolian",serif}
  .f-ita{font-family:"Noto Sans Old Italic",serif}
  .f-cop{font-family:"Noto Sans Coptic",serif}
  .f-got{font-family:"Noto Sans Gothic",serif}
  .f-gla{font-family:"Noto Sans Glagolitic",serif}
  .f-arm{font-family:"Noto Sans Armenian",serif}
  .f-geo{font-family:"Noto Sans Georgian",serif}
  .f-lat{font-family:"EB Garamond",Georgia,serif}
  .f-cap{font-family:"Cinzel","EB Garamond",serif}
  .f-bl{font-family:"UnifrakturMaguntia","EB Garamond",serif}
</style>
</head>
<body>

<div id="stage"><div id="world"></div></div>

<script>
(function(){
"use strict";

/* ═══ язык: регион, затем язык браузера. Переключателя нет, но ?lang= работает ═══ */
function pickLang(){
  var q = (location.search.match(/[?&]lang=(ru|en)/) || [])[1];
  if(q) return q;
  var tz = '';
  try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
  var RU = /^(Europe\/(Moscow|Kaliningrad|Samara|Volgograd|Saratov|Astrakhan|Ulyanovsk|Kirov|Minsk)|Asia\/(Yekaterinburg|Omsk|Novosibirsk|Barnaul|Tomsk|Novokuznetsk|Krasnoyarsk|Irkutsk|Chita|Yakutsk|Khandyga|Vladivostok|Ust-Nera|Magadan|Sakhalin|Srednekolymsk|Kamchatka|Anadyr|Almaty|Bishkek|Tashkent))$/;
  if(RU.test(tz)) return 'ru';
  var langs = (navigator.languages || [navigator.language || '']).join(',').toLowerCase();
  if(/\b(ru|be|kk|ky)(-|,|$)/.test(langs)) return 'ru';
  return 'en';
}
var LANG = pickLang();
document.documentElement.lang = LANG;
function T(pair){ return !pair ? '' : (LANG === 'ru' ? pair[0] : pair[1]); }

var UI = {

function svgSign(key){
  var d = DRAWN[key] || DRAWN.ox;
  return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
    d.map(function(x){ return '<path d="'+x+'"/>'; }).join('') + '</svg>';
}

var W = function(slug, ru, en){ return [[ru||('Wikipedia: '+slug.replace(/_/g,' ')), en||('Wikipedia: '+slug.replace(/_/g,' '))],
       'https://en.wikipedia.org/wiki/'+slug]; };
var UC = function(hex){ return [['Unicode '+hex,'Unicode '+hex], 'https://www.unicode.org/charts/PDF/U'+hex+'.pdf']; };

/* ═══ письменности: описание пишется один раз на все три буквы ═══ */
var SC = {
 grkArch:{n:['Архаический греческий','Archaic Greek'], d:['VIII в. до н. э.','8th c. BCE'],
   m:['Греция','Greece'],
   x:[['В древнейших греческих надписях буква лежит на боку: писали ещё справа налево, и знаки зеркалились. Форма встаёт на ноги только вместе с переходом на письмо слева направо.',
       'In the earliest Greek inscriptions the letter rests on its side: writing still ran right to left and the signs were mirrored. It stands upright only once the direction flips.'],
      ['Местных вариантов было множество, они держались примерно до 400 г. до н. э.; Афины официально приняли единый алфавит в 403 г. до н. э.',
       'Local varieties were many and lasted until about 400 BCE; Athens officially adopted the unified alphabet in 403 BCE.']],
   u:'', s:[W('Archaic_Greek_alphabets'), W('Greek_alphabet')]},

 grkWest:{n:['Западногреческий («красный»)','Western Greek ("red")'], d:['VIII в. до н. э.','8th c. BCE'],
   m:['Эвбея, Кумы, Питекусы','Euboea, Cumae, Pithekoussai'],
   x:[['Вот куда уходит латиница. «Красный» западный тип бытовал в Эвбее, центральной Греции и почти во всех италийских колониях; «именно он был передан на Запад и стал предком латинского алфавита».',
       'This is where Latin goes. The "red" western type was used in Euboea, central Greece and most Italian colonies; it "is the one that was later transmitted to the West and became the ancestor of the Latin alphabet".'],
      ['То есть латиница пришла не из классического греческого, который мы знаем по математике: тот ионийский, «синий» тип — двоюродный брат, а не предок.',
       'So Latin did not come from the classical Greek we know from mathematics: that Ionic, "blue" type is a cousin, not an ancestor.']],
   u:'', s:[W('Archaic_Greek_alphabets')]},

 latOld:{n:['Старолатинское письмо','Old Latin'], d:['VII–VI вв. до н. э.','7th–6th c. BCE'],
   m:['Лаций','Latium'],
   x:[['Древнейшие латинские формы видны на надписи Дуэноса VI века до н. э.: поперечины косые, штрихи неравной длины, направление письма ещё непостоянно.',
       'The oldest Latin forms appear on the 6th-century BCE Duenos inscription: slanting crossbars, strokes of unequal length, the direction of writing not yet fixed.']],
   u:'', s:[W('History_of_the_Latin_script'), W('Duenos_inscription')]},

 latCap:{n:['Римский монументальный капитал','Roman monumental capitals'], d:['I в. до н. э. — V в.','1st c. BCE – 5th c. CE'],
   m:['Рим','Rome'],
   x:[['Capitalis monumentalis — парадное письмо надписей на камне, размеченное кистью и резанное долотом. Отсюда происходят все современные прописные.',
       'Capitalis monumentalis — the formal script of stone inscriptions, laid out with a brush and cut with a chisel. All modern capitals come from here.'],
      ['Дальше цепочка раздваивается: прописная отсюда почти не менялась, а строчная пошла длинным путём через скоропись и книжные почерки.',
       'From here the chain forks: the capital barely changed, while the lowercase took the long road through cursive and book hands.']],
   u:'', s:[W('Roman_square_capitals')]},

 latMaj:{n:['Капитал доживает без изменений','The capital survives unchanged'], d:['I в. до н. э. — сегодня','1st c. BCE – today'],
   m:['Рим, затем вся Европа','Rome, then all of Europe'],
   x:[['Девятнадцать веков без единого заметного шага. Пока строчная ходила кругами через скоропись и книжные почерки, капитал просто лежал и ждал.',
       'Nineteen centuries without a single visible step. While the lowercase went the long way round through cursive and book hands, the capital simply sat and waited.'],
      ['Гуманисты XV века вернули римский капитал как прописную к своему минускулу, и с него печатники нарезали первые шрифты антиквы. Это не новая буква, а та же самая.',
       'The 15th-century humanists brought the Roman capital back as the uppercase for their minuscule, and the printers cut the first roman types from it. Not a new letter — the same one.']],
   u:'', s:[W('Roman_square_capitals'), W('Humanist_minuscule')]},

 latG:{n:['Рождение G','The birth of G'], d:['ок. 230 г. до н. э.','c. 230 BCE'],
   m:['Рим','Rome'],
   x:[['Единственный случай в этих трёх цепочках, когда буква делится надвое. «K» вышла из употребления, «C» стала передавать /k/ во всех позициях — и звонкий /g/ остался без знака. Тогда к C просто добавили штрих.',
       'The one case in these three chains where a letter splits in two. "K" had fallen out of favor, "C" had come to express /k/ in all environments — and the voiced /g/ was left with no sign. So a stroke was added to C.'],
      ['Создателем называют Спурия Карвилия Ругу, вольноотпущенника, открывшего около 230 г. до н. э. первую в Риме платную школу. Источник — Плутарх; атрибуция оспаривалась.',
       'The recorded originator is Spurius Carvilius Ruga, a freedman who opened the first fee-paying school in Rome around 230 BCE. The source is Plutarch; the attribution has been disputed.'],
      ['И вот где цепочки действительно пересекаются: новую букву поставили на СЕДЬМОЕ место — туда, где раньше стояла Z, выброшенная из алфавита цензором Аппием Клавдием. То есть G заняла чужую могилу. Z вернётся в латиницу много позже, снова из греческого, и встанет уже в конец.',
       'And here is where the chains really do cross: the new letter took SEVENTH place — the slot of Z, which the censor Appius Claudius had thrown out of the alphabet. G moved into another letter\u2019s grave. Z would return to Latin much later, from Greek again, and take a place at the end.']],
   u:'', s:[W('G'), W('Spurius_Carvilius_Ruga')]},

 latGunc:{n:['Унциальная ᵹ','Uncial ᵹ'], d:['IV–VIII вв.','4th–8th c. CE'],
   m:['Латинский Запад','the Latin West'],
   x:[['«⟨g⟩ имеет плоский верх, без чашки, и изогнутый выносной элемент ⟨ᵹ⟩ — отчасти похожа на цифру 5». На эту форму g была непохожа ни до, ни после.',
       '"g has a flat top, no bow, and a curved descender — somewhat resembling the digit 5." The letter looked like this neither before nor after.']],
   u:'', s:[W('Half-uncial'), W('Uncial_script')]},

 latGcar:{n:['Каролингская g','Carolingian g'], d:['IX в.','9th c.'],
   m:['Ахен, Тур','Aachen, Tours'],
   x:[['«Буква g по существу та же, что современная строчная, а не прежняя унциальная ᵹ». Дальше она уже не меняется — меняется только выбор между двумя её изводами.',
       '"The letter g is essentially the same as the modern minuscule letter, rather than the previously common uncial ᵹ." After this it no longer changes — only the choice between its two variants does.']],

 latGmod:{n:['Современные G и g','Modern G and g'], d:['сегодня','today'],
   m:['Латиница','Latin alphabet'],
   x:[['Двухэтажная «петлехвостая» g — исходная, каролингская; она в большинстве антиквенных шрифтов, и у неё есть «ушко» справа вверху. Одноэтажная «открытохвостая» появилась позже, в монастырском переписывании; ею печатал Гутенберг, а гуманисты вернулись к петле.',
       'The double-storey "looptail" g is the original, the Carolingian one; it is in most serif types and has an "ear" at the upper right. The single-storey "opentail" came later, from monastic copying; Gutenberg printed with it, and the humanists went back to the loop.'],
      ['Для Юникода это одна буква: U+0067 покрывает оба начертания. Отдельный знак ɡ (U+0261) существует только для строгой записи МФА.',
       'For Unicode it is one letter: U+0067 covers both shapes. The separate ɡ (U+0261) exists only for strict IPA notation.']],
   u:'U+0047 · U+0067', s:[W('G')]},

 latBi:{n:['Два регистра в одном тексте','Two cases in one text'], d:['с IX в., закреплено печатью','from the 9th c., fixed by printing'],
   m:['Европа','Europe'],
   x:[['Вот где ветки сходятся обратно. До этого момента прописных букв не существовало — не потому что их не придумали, а потому что не с чем было противопоставлять: алфавит был ОДИН. Финикийским, греческим, этрусским, старолатинским, римским капиталом, унциалом — каждым из них писали весь текст целиком.',
       'This is where the branches meet again. Until this point capitals did not exist — not because nobody had invented them, but because there was nothing to contrast them with: there was ONE alphabet. Phoenician, Greek, Etruscan, Old Latin, Roman capitals, uncial — each wrote whole texts on its own.'],
      ['«Хотя маюскульные письменности изначально использовались для записи целых текстов, их буквы со временем стали употребляться преимущественно в современной функции прописных букв в европейском письме». Смешение двух наборов в одном тексте впервые описано как каролингское соглашение: «употребление верхнего регистра для заголовков, смесь верхнего и нижнего для подзаголовков и нижний регистр для основного текста».',
       '"While majuscule scripts were originally used to write entire texts, their letters eventually came to be used primarily with the modern function of uppercase letters in European writing." Mixing the two sets in one text is first described as a Carolingian convention: "the usage of upper-case for titles, a mix of upper and lower case for subtitles, and lower case for the body of a text."'],
      ['Твёрдой даты, когда латиница стала двухрегистровой окончательно, источники не дают. Сами слова «верхний» и «нижний регистр» — вообще из типографии: «заглавные буквы хранились в отдельном неглубоком лотке, или „кассе“, которая располагалась над кассой со строчными».',
       'The sources give no firm date for when Latin became fully bicameral. The very words "upper case" and "lower case" come from the print shop: "the capital letters were stored in a separate shallow tray or ‘case’ that was located above the case that held the small letters."']],
   u:'U+0041 · U+0061', s:[W('Letter_case'), W('Carolingian_minuscule')]},

 latRust:{n:['Рустичный капитал','Rustic capitals'], d:['I–IX вв.','1st–9th c. CE'],
   m:['Рим','Rome'],
   x:[['«Похож на римский квадратный капитал, но менее жёсткий, под большим влиянием письма пером и чернилами. Буквы тоньше и сжатее, кривых линий намного больше, есть выносные элементы ниже строки».',
       '"Similar to Roman square capitals, but are less rigid, influenced more by pen and ink writing. The letters are thinner and more compressed, use many more curved lines than do square capitals, and have descenders extending below the baseline."']],
   u:'', s:[W('Rustic_capitals')]},

 latOrc:{n:['Староримский курсив','Old Roman cursive'], d:['I в. до н. э. — III в.','1st c. BCE – 3rd c. CE'],
   m:['Рим','Rome'],
   x:[['Вот где на самом деле начинаются строчные — и начинаются они не как замысел, а как побочный эффект спешки. Бытовое письмо: счета, письма, граффити, школьные упражнения. «Углы обычных букв писались в римском курсиве кривыми» — просто потому, что так быстрее вести инструментом.',
       'This is where lowercase actually begins — and it begins not as a design but as a side effect of haste. Everyday writing: accounts, letters, graffiti, classroom exercises. "The angles of standard letters were written as curves in Roman cursive" — simply because that is faster to draw.'],
      ['Читать его тяжело: «⟨b⟩ и ⟨d⟩ трудно различить, ⟨e⟩ в полную высоту, ⟨p⟩ и ⟨t⟩ очень похожи».',
       'It is hard to read: "b and d are hard to distinguish, e is a full height letter, p and t are very similar."']],
   u:'', s:[W('Roman_cursive')]},

 latNrc:{n:['Новоримский курсив','New Roman cursive'], d:['III–VII вв.','3rd–7th c. CE'],
   m:['Рим','Rome'],
   x:[['Здесь перелом, но и он растянут на четыре века: «⟨a⟩, ⟨b⟩, ⟨d⟩ и ⟨e⟩ принимают более привычный вид», и буквы впервые «соразмерны друг другу, а не скачут дико по размеру и положению на строке».',
       'The turning point here is itself spread over four centuries: "a, b, d, and e have taken a more familiar shape", and for the first time the letters are "proportionate to each other rather than varying wildly in size and placement on the line."'],
      ['Заметьте формулировку: названы четыре буквы, а не алфавит целиком. Строчные приходили поштучно и в разное время — ⟨a⟩ и ⟨b⟩ раньше, остальные позже.',
       'Note the wording: four letters are named, not the whole alphabet. Lowercase arrived letter by letter and at different times — a and b earlier, the rest later.'],
      ['«Новоримский курсив лёг в основу унциального и полуунциального письма, особенно для букв ⟨a⟩, ⟨g⟩, ⟨r⟩ и ⟨s⟩». Поэтому от этого узла на карте идут две дополнительные линии вправо: книжные почерки наследовали и капиталу, и курсиву сразу.',
       '"New Roman cursive formed part of the basis of the uncial and half-uncial scripts, particularly for the letters a, g, r, and s." That is why two extra lines leave this node: the book hands inherited from both the capital and the cursive at once.']],
   u:'', s:[W('Roman_cursive')]},

 latUnc:{n:['Унциал','Uncial'], d:['IV–VIII вв.','4th–8th c. CE'],
   m:['Латинский и греческий Запад','the Latin and Greek West'],
   x:[['Если эти почерки кажутся похожими — так и есть, и скелет тут ни при чём. Унциал, полуунциал, каролингский минускул и гуманистический различаются прежде всего углом пера, контрастом толстого и тонкого, пропорцией и порядком штрихов. На карте показан скелет буквы, а скелет как раз почти не меняется. Разница в весе штриха здесь передана условно, по описаниям; увидеть её по-настоящему можно только на развороте рукописи.',
       'If these hands look alike — they do, and the skeleton is not the reason. Uncial, half-uncial, Carolingian and humanist minuscule differ above all in pen angle, thick-thin contrast, proportion and stroke order. This map shows the skeleton of the letter, and the skeleton is exactly what barely changes. The difference in stroke weight here is indicative, drawn from the descriptions; to see it properly you need an opening of a manuscript.'],
      ['«Маюскульное письмо, широко употреблявшееся с IV по VIII век латинскими и греческими писцами». Широкие одномоментные штрихи круглых форм: пергамен позволял то, чего не позволял папирус.',
       '"A majuscule script commonly used from the 4th to 8th centuries AD by Latin and Greek scribes." Broad single-stroke letters using simple round forms: parchment allowed what papyrus did not.'],
      ['«Ранний унциал, скорее всего, развился из позднего рустичного капитала».',
       '"Early uncial script most likely developed from late rustic capitals."']],
   u:'', s:[W('Uncial_script')]},

 latHunc:{n:['Полуунциал','Half-uncial'], d:['III–VIII вв.','3rd–8th c. CE'],
   m:['Рим, Африка, Ирландия, Англия','Rome, Africa, Ireland, England'],
   x:[['Посмотрите на даты соседних узлов: староримский курсив I в. до н. э. — III в., новоримский III–VII, рустичный капитал I–IX, унциал IV–VIII, полуунциал III–VIII. Они перекрываются на века. Никакой точки, где «появились строчные», нет: несколько письменностей жили одновременно и перетекали друг в друга примерно восемьсот лет.',
       'Look at the dates on the neighbouring nodes: old Roman cursive 1st c. BCE – 3rd c. CE, new Roman cursive 3rd–7th, rustic capitals 1st–9th, uncial 4th–8th, half-uncial 3rd–8th. They overlap by centuries. There is no point at which "lowercase appeared": several scripts lived side by side and bled into each other for some eight hundred years.'],
      ['Здесь появляются настоящие строчные: «⟨a⟩ обычно круглая ⟨ɑ⟩, иногда со слегка открытым верхом», «⟨b⟩ и ⟨d⟩ имеют вертикальные стойки, тождественные современным буквам».',
       'Here the real lowercase appears: "a is usually round, sometimes with a slightly open top", "b and d have vertical stems, identical to the modern letters."'],
      ['Название обманчиво: «полуунциал — плохое имя, поскольку предполагает некий органический долг перед обычным унциалом». Оба наследуют рустичному капиталу; по другой версии полуунциал идёт от позднеримского курсива.',
       'The name misleads: "half-uncial is a poor name to the extent that it suggests some organic debt to regular uncial". Both inherit from rustic capitals; by another view half-uncial descends from late Roman cursive.']],
   u:'', s:[W('Half-uncial'), W('Uncial_script')]},

 latCaro:{n:['Каролингский минускул','Carolingian minuscule'], d:['конец VIII — IX в.','late 8th – 9th c.'],
   m:['Ахен, Тур, Корби','Aachen, Tours, Corbie'],
   x:[['Важность этого узла не в новой форме буквы, а в том, что форма наконец ЗАФИКСИРОВАНА. До него каждый скрипторий писал по-своему; после — вся Европа пишет одинаково. Это узел стандартизации, а не изобретения.',
       'What matters here is not a new letter shape but that the shape is finally FIXED. Before it, every scriptorium wrote its own way; after it, all of Europe writes the same. This is a node of standardisation, not invention.'],
      ['Создан при Карле Великом. Алкуин Йоркский руководил придворным скрипторием в Ахене в 782–796 годах, затем перестроил скрипторий в Туре.',
       'Created under Charlemagne. Alcuin of York ran the palace scriptorium at Aachen from 782 to 796, then restructured the scriptorium at Tours.'],
      ['«Единообразное письмо округлых форм, ясно различимые знаки, дисциплинированное и прежде всего читаемое». Пробелы между словами и прописные для заголовков — отсюда.',
       '"Uniform with rounded shapes in clearly distinguishable glyphs, disciplined and above all, legible." Spaces between words and capitals for titles start here.']],
   u:'', s:[W('Carolingian_minuscule')]},

 latBlack:{n:['Готический минускул','Blackletter'], d:['XI–XV вв.','11th–15th c.'],
   m:['Северная Европа','Northern Europe'],
   x:[['Каролингский минускул, сжатый и переломанный: «в десятом и одиннадцатом веках он развился в письмо, ставшее известным как блэклеттер, или готическое».',
       'Carolingian minuscule compressed and broken: it "evolved in the tenth and eleventh centuries into a script which became known as blackletter or Gothic script."'],
      ['Для современной антиквы это тупик: Гутенберг печатал готикой, но победили итальянские печатники с гуманистическим минускулом. В Германии и Скандинавии готика держалась до XX века.',
       'A dead end for modern roman type: Gutenberg printed in blackletter, but the Italian printers with their humanist minuscule won. In Germany and Scandinavia blackletter held on into the 20th century.']],
   u:'', s:[W('Blackletter')]},

 latHum:{n:['Гуманистический минускул','Humanist minuscule'], d:['начало XV в.','early 15th c.'],
   m:['Флоренция','Florence'],
   x:[['И этот узел — не про форму буквы, а про то, какая ветка победит. Каролингский минускул к XV веку уже триста лет как выродился в готику; гуманисты вернулись через её голову к каролингской форме. Если бы не вернулись, вы читали бы этот текст готическим шрифтом.',
       'This node, too, is not about letter shape but about which branch wins. By the 15th century Carolingian minuscule had been degenerating into blackletter for three hundred years; the humanists reached back over its head to the Carolingian form. Had they not, you would be reading this in blackletter.'],
      ['«Создателем нового стиля был Поджо Браччолини, неутомимый охотник за древними рукописями, который разработал новый гуманистический почерк в первое десятилетие XV века».',
       '"The generator of the new style was Poggio Bracciolini, a tireless pursuer of ancient manuscripts, who developed the new humanist script in the first decade of the 15th century."'],
      ['В основании всей нашей типографики лежит ошибка: гуманисты приняли каролингские рукописи XI–XII веков за древнеримские. «Когда они держали в руках книги, переписанные писцами одиннадцатого и двенадцатого веков, литераторы кватроченто думали, что смотрят на тексты прямо из книжных лавок древнего Рима».',
       'A mistake sits at the root of all our typography: the humanists took 11th–12th-century Carolingian manuscripts for ancient Roman ones. "When they handled manuscript books copied by eleventh- and twelfth-century scribes, Quattrocento literati thought they were looking at texts that came right out of the bookshops of ancient Rome."']],
   u:'', s:[W('Humanist_minuscule')]},

 cun:{n:['Клинопись','Cuneiform'], d:['с конца IV тыс. до н. э.','from the late 4th mill. BCE'],
   m:['Шумер, Месопотамия','Sumer, Mesopotamia'],
   x:[['Древнейшее известное письмо. Алфавиту оно НЕ предок: в справочнике у клинописи прямо указано «дочерних систем нет; повлияла на форму знаков угаритского и древнеперсидского».',
       'The earliest known writing. It is NOT an ancestor of the alphabet: the reference states flatly that cuneiform has "no child systems; influenced the shape of Ugaritic and Old Persian glyphs".'],
      ['Единственная ниточка к нашему дереву — осторожное предположение, что шумерское протописьмо повлияло на появление египетской иероглифики: она «возникла немного позже и, вероятно, была изобретена под его влиянием». Определённого вывода о происхождении иероглифики нет. Поэтому на карте эта связь показана пунктиром.',
       'The one thread to our tree is a hedged suggestion that Sumerian proto-writing influenced the rise of Egyptian hieroglyphs: they "came into existence a little after [Sumerian script], and, probably, [were] invented under the influence of the latter". No definitive determination has been made. Hence the dotted line on this map.']],
   u:'U+12000–U+123FF', s:[W('Cuneiform'), UC('12000')]},

 egy:{n:['Египетская иероглифика','Egyptian hieroglyphs'], d:['с XXXII в. до н. э.','from the 32nd c. BCE'],
   m:['Египет','Egypt'],
   x:[['Алфавит родился из неё не прямым наследованием, а трюком: несколько знаков взяли ради ПЕРВОГО звука их египетского названия, забыв про смысл рисунка.',

 psin:{n:['Протосинайское письмо','Proto-Sinaitic script'], d:['XIX–XVI вв. до н. э.','19th–16th c. BCE'],
   m:['Синай, Серабит-эль-Хадим','Sinai, Serabit el-Khadim'],
   x:[['Корень всего дерева: бирюзовые копи на Синае и Вади-эль-Холь в Среднем Египте. Датировка спорна — ранняя около 1850 г. до н. э., поздняя около 1550 г. до н. э.',

 ugar:{n:['Угаритский алфавит','Ugaritic alphabet'], d:['ок. 1400–1190 до н. э.','c. 1400–1190 BCE'],
   m:['Угарит, Рас-Шамра, Сирия','Ugarit, Ras Shamra, Syria'],
   x:[['Вот она, связь с клинописью. Это настоящий алфавит из 30 букв, но выдавленный клином по глине. «То, что угаритское письмо клинописное и что направление письма у него то же, что у других клинописных систем, поддерживает гипотезу, что оно было напрямую вдохновлено клинописной системой вроде аккадской».',
       'Here is the link to cuneiform. A real 30-letter alphabet, but pressed into clay with a wedge stylus. "The facts that the Ugaritic alphabet is written in cuneiform and that it has been found to overwhelmingly follow the same writing direction as other cuneiform systems both support the hypothesis that Ugaritic was directly inspired by a cuneiform system such as Akkadian cuneiform."'],
      ['Финикийскому оно не предок, а двоюродный брат: обе ветви идут от протосинайского, и обе отметки стоят со знаком вопроса. Зато именно угаритские абецедарии дают «древнейшее прямое свидетельство не только порядка „abc“, но и порядка „hlḥm“» — то есть обоих алфавитных порядков сразу.',
       'It is not an ancestor of Phoenician but a cousin: both branch off Proto-Sinaitic, and both links carry a question mark. What Ugarit does give is the abecedaries — "the earliest direct evidence of not just the ‘abc’ alphabetical order but also the ‘hlḥm’ order", both at once.'],
      ['Осторожность источника стоит повторить: «из-за простой и крайне абстрактной природы угаритских знаков легко найти графические сходства с многими другими письменностями того времени».',
       'The source’s own caution is worth repeating: "due to the simple and highly abstract nature of Ugaritic characters, it is easy to find graphical similarities and phonological matches with many other scripts of the time."']],
   u:'U+10380–U+1039F', s:[W('Ugaritic_alphabet'), UC('10380')]},

/* где письменность двухрегистровая — вторая, строчная форма буквы */
(function(){
  var LOWER = {
    grk: [['α','f-lat'],['β','f-lat'],['γ','f-lat']],
    cyr: [['а','f-lat'],['в','f-lat'],['г','f-lat']],
    copt:[['ⲁ','f-cop'],['ⲃ','f-cop'],['ⲅ','f-cop']],
    arm: [['ա','f-arm'],['բ','f-arm'],['գ','f-arm']],
    glag:[['ⰰ','f-gla'],['ⰱ','f-gla'],['ⰳ','f-gla']]
  };
  Object.keys(LOWER).forEach(function(id){ if(SCL[id]) SCL[id].g2 = LOWER[id]; });
  /* узел слияния регистров — настоящая пара */
  SCL.latBi.g  = [['A','f-lat'],['B','f-lat'],['C','f-lat']];
  SCL.latBi.g2 = [['a','f-lat'],['b','f-lat'],['c','f-lat']];

/* живые алфавиты — в фильтр; вымершие — отдельной строкой */
var ALSO = {lat:['latMaj','latBlack','latBi','latNrc','latGmod']};
var LIVING  = ['lat','grk','cyr','heb','arab','syr','geez','arm','geo','copt','mong','sam','mand'];
var EXTINCT = ['ugar','goth','glag','cun'];
var SELECTED = {lat:true};

/* видимы: выбранные плюс все их предки, но клинопись — только если выбрана сама */
function visibleSet(){
  var vis = {};
  Object.keys(SELECTED).forEach(function(id){
    if(!SELECTED[id]) return;
    var queue = [id].concat(ALSO[id] || []);
    queue.forEach(function(start){
      var cur = start;
      while(cur && SCL[cur]){
        vis[cur] = true;
        if(cur === 'egy') break;
        cur = SCL[cur].p;
      }
    });
  });
  if(!Object.keys(vis).length) vis.egy = true;
  return vis;
}

/* ═══ раскладка ═══ */
var COLP = 226, ROWH = 112, NODEW = 150, GW = 34, ATTACH = 32, BANDGAP = 150;
var world = document.getElementById('world');
var stage = document.getElementById('stage');
var pop = document.getElementById('pop');
var openId = null, POS = {}, worldW = 0, worldH = 0;

function buildLayout(){
  var vis = visibleSet();
  var ids = Object.keys(SCL).filter(function(id){ return vis[id]; });
  var kids = {}, roots = [];
  ids.forEach(function(id){ kids[id] = []; });
  ids.forEach(function(id){
    var p = SCL[id].p;
    if(p && vis[p]) kids[p].push(id); else roots.push(id);
  });
  var depth = {};
  ids.forEach(function(id){
    var c = 0, cur = id;
    while(SCL[cur].p && vis[SCL[cur].p]){ cur = SCL[cur].p; c++; }
    depth[id] = c;
  });
  /* «капитал без изменений» уезжает в колонку современной строчной,
     чтобы его линия шла одной прямой поверху и ничего не пересекала */
  if(vis.latMaj && vis.lat) depth.latMaj = depth.lat;
  if(vis.latGmod && vis.lat) depth.latGmod = depth.lat;
  var lane = 0, row = {};
  function walk(id){
    if(!kids[id].length){ row[id] = lane++; return; }
    kids[id].forEach(walk);
    row[id] = (row[kids[id][0]] + row[kids[id][kids[id].length - 1]]) / 2;
  }
  roots.sort(function(a, b){ return (a === 'cun' ? -1 : 0) - (b === 'cun' ? -1 : 0); });
  roots.forEach(function(r, i){ if(i) lane += 0.6; walk(r); });

  POS = {}; worldW = 0;
  var cursor = 70;
  for(var li = 0; li < 3; li++){
    /* каждая полоса занимает ровно столько, сколько в ней узлов:
       ветка G есть только у гимеля, у остальных её дорожки пустуют */
    var mine = ids.filter(function(id){
      return !SCL[id].only || SCL[id].only.indexOf(li) >= 0;
    });
    var lo = Infinity, hi = -Infinity;
    mine.forEach(function(id){ lo = Math.min(lo, row[id]); hi = Math.max(hi, row[id]); });
    var off = cursor - lo * ROWH;
    mine.forEach(function(id){
      var x = depth[id] * COLP;
      var y = off + row[id] * ROWH + ROWH / 2;
      POS[li + ':' + id] = {x:x, y:y, line:li, sc:id, parent:(SCL[id].p && vis[SCL[id].p]) ? SCL[id].p : null};
      worldW = Math.max(worldW, x + NODEW);
    });
    POS['band' + li] = {x:-10, y:cursor - 34, label:true, line:li};
    cursor += (hi - lo + 1) * ROWH + BANDGAP;
  }
  worldH = cursor - BANDGAP + 60;
}

/* прямая, поворот под прямым углом со скруглением, снова прямая */
function elbow(sx, sy, ex, ey){
  if(Math.abs(sy - ey) < 0.6) return 'M' + sx + ' ' + sy + 'L' + ex + ' ' + ey;
  var mx = (sx + ex) / 2;
  var dir = ey > sy ? 1 : -1;
  var r = Math.min(16, Math.abs(ey - sy) / 2, Math.abs(ex - sx) / 2);
  return 'M' + sx + ' ' + sy +
         'L' + (mx - r) + ' ' + sy +
         'Q' + mx + ' ' + sy + ' ' + mx + ' ' + (sy + dir * r) +
         'L' + mx + ' ' + (ey - dir * r) +
         'Q' + mx + ' ' + ey + ' ' + (mx + r) + ' ' + ey +
         'L' + ex + ' ' + ey;
}

function render(){
  buildLayout();
  world.innerHTML = '';
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'lines');
  svg.setAttribute('width', worldW + 60);
  svg.setAttribute('height', worldH + 60);
  var d = '', dh = '';
  Object.keys(POS).forEach(function(key){
    var n = POS[key];
    if(n.label || !n.parent) return;
    var a = POS[n.line + ':' + n.parent];
    if(!a) return;
    var seg = elbow(a.x + NODEW / 2 + ATTACH, a.y, n.x + NODEW / 2 - ATTACH, n.y);
    if(n.sc === 'egy') dh += seg; else d += seg;
  });
  /* рёбра, которых не бывает в дереве с одним родителем */
  var MERGE = [['latMaj','latBi'], ['latNrc','latHunc']];
  for(var li = 0; li < 3; li++){
    MERGE.forEach(function(pair){
      var a2 = POS[li + ':' + pair[0]], b2 = POS[li + ':' + pair[1]];
      if(!a2 || !b2 || b2.x <= a2.x) return;
      d += elbow(a2.x + NODEW / 2 + ATTACH, a2.y, b2.x + NODEW / 2 - ATTACH, b2.y);
    });
  }
  svg.innerHTML = '<path d="' + d + '"/><path class="hedge" d="' + dh + '"/>';
  world.appendChild(svg);

  Object.keys(POS).forEach(function(key){
    var n = POS[key];
    if(n.label){
      var t = document.createElement('div');
      t.className = 'band';
      t.style.left = n.x + 'px'; t.style.top = n.y + 'px';
      t.innerHTML = T(LINE[n.line].n) + '<i>' + T(LINE[n.line].s) + '</i>';
      world.appendChild(t);
      return;
    }
    var sc = SC[n.sc], L = SCL[n.sc], g = L.g[n.line];
    var b = document.createElement('button');
    b.className = 'node'; b.type = 'button';
    b.setAttribute('aria-expanded', 'false');
    b.setAttribute('aria-label', T(sc.n) + ', ' + half(L.ln[n.line]));
    b.dataset.id = key;
    b.style.left = n.x + 'px'; b.style.top = (n.y - 20) + 'px';
    b.style.width = NODEW + 'px';
    var g2 = L.g2 ? L.g2[n.line] : null;
    b.innerHTML = '<span class="pair">' + glyphHTML(g, GW) +
      (g2 ? glyphHTML(g2, Math.round(GW * 0.78)) : '') + '</span>' +
      '<span class="tx"><span class="nm">' + T(sc.n) + '</span>' +
      '<span class="dt">' + half(L.ln[n.line]) + ' · ' + T(sc.d) + '</span></span>';
    world.appendChild(b);
  });
  if(openId && !POS[openId]) hidePop();
}

function half(str){
  var i = str.indexOf(' / ');
  if(i < 0) return str;
  return LANG === 'ru' ? str.slice(0, i) : str.slice(i + 3);
}
var WEIGHT = {rust:4.2, orc:4.6, nrc:5, unc:8.4, hunc:6.2, car:5.6, gk:5.4, lat:5.6, ps:6, ox:6, house:6, stick:6};
function strokeOf(key){
  var pre = key.split('_')[0];
  return WEIGHT[pre] || WEIGHT[key] || 6;
}
function glyphHTML(g, px){
  if(!g) return '<span class="gl none" style="width:' + px + 'px;height:' + px + 'px"></span>';
  if(typeof g === 'string') return '<span class="gl" style="width:' + px + 'px;height:' + px +
    'px;--sw:' + strokeOf(g) + '">' + svgSign(g) + '</span>';
  return '<span class="gl ' + g[1] + '" style="width:' + px + 'px;height:' + px + 'px;font-size:' + Math.round(px * (g[2] || 1)) + 'px">' + g[0] + '</span>';
}

/* ═══ шапка и фильтр ═══ */
function chip(id){
  var on = !!SELECTED[id], L = SCL[id];
  var up = L && L.g ? L.g[0] : null, lo = L && L.g2 ? L.g2[0] : null;
  function one(g, cls){
    if(!g) return '';
    if(typeof g === 'string') return '';
    return '<span class="' + g[1] + '">' + g[0] + '</span>';
  }
  return '<label class="' + (on ? 'on' : '') + '" data-sc="' + id + '">' +
         '<span class="fg">' + one(up) + one(lo) + '</span>' +
         '<span class="fn">' + T(SC[id].n) + '</span>' +
         '<span class="fb"></span>' +
         '<input type="checkbox"' + (on ? ' checked' : '') + '></label>';
}
document.getElementById('head').innerHTML =
  '<h1>' + T(UI.title) + '</h1>' +
  '<p>' + T(UI.sub) + '</p>' +
  '<div id="filter">' + LIVING.map(chip).join('') +
  '<span class="sep">' + T(UI.extinct) + '</span>' + EXTINCT.map(chip).join('') + '</div>' +
  '<p class="small">' + T(UI.hint) + '  ·  ' + T(UI.links) + '</p>';

document.getElementById('filter').addEventListener('click', function(e){
  var lab = e.target.closest('label'); if(!lab) return;
  e.preventDefault();
  var id = lab.dataset.sc;
  SELECTED[id] = !SELECTED[id];
  lab.classList.toggle('on', !!SELECTED[id]);
  lab.querySelector('input').checked = !!SELECTED[id];
  render(); apply();
});

/* ═══ карточка ═══ */
function popHTML(key){
  var n = POS[key], sc = SC[n.sc], L = SCL[n.sc], g = L.g[n.line];
  var h = '<div class="pg">' + glyphHTML(g, 64) + '</div>';
  h += '<p class="pt">' + half(L.ln[n.line]) + '</p>';
  h += '<p class="pl">' + T(sc.n) + '</p>';
  h += '<p class="pm">' + T(sc.m) + ' · ' + T(sc.d) + '</p>';
  if(L.nt[n.line]) h += '<p class="pd pn">' + T(L.nt[n.line]) + '</p>';
  sc.x.forEach(function(x){ h += '<p class="pd">' + T(x) + '</p>'; });
  if(sc.u) h += '<p class="pu">' + sc.u + '</p>';
  h += '<p class="ps">' + sc.s.map(function(x){
         var ext = /^https?:/.test(x[1]) ? ' target="_blank" rel="noopener"' : '';
         return '<a href="' + x[1] + '"' + ext + '>' + T(x[0]) + '</a>';
       }).join('') + '</p>';
  h += '<button class="pclose" type="button">' + T(UI.close) + '</button>';
  return h;
}
function placePop(key){
  var n = POS[key];
  if(!n || !pop.classList.contains('on')) return;
  var el = world.querySelector('.node[data-id="' + CSS.escape(key) + '"]');
  if(!el) return;
  var r = el.getBoundingClientRect();
  var vw = document.documentElement.clientWidth, vh = window.innerHeight;
  var pw = pop.offsetWidth, ph = pop.offsetHeight;
  var left = r.right + 16;
  if(left + pw > vw - 14) left = r.left - pw - 16;
  if(left < 14) left = Math.max(14, Math.min(vw - pw - 14, r.left));
  var top = r.top - 14;
  if(top + ph > vh - 14) top = vh - ph - 14;
  if(top < 12) top = 12;
  pop.style.left = Math.round(left) + 'px';
  pop.style.top = Math.round(top) + 'px';
}
function showPop(key){
  if(!POS[key]) return;
  openId = key;
  pop.innerHTML = popHTML(key);
  pop.classList.add('on');
  pop.querySelector('.pclose').addEventListener('click', hidePop);
  world.classList.add('dim');
  world.querySelectorAll('.node').forEach(function(el){
    el.setAttribute('aria-expanded', el.dataset.id === key ? 'true' : 'false');
  });
  placePop(key);
}
function hidePop(){
  openId = null;
  pop.classList.remove('on'); pop.innerHTML = '';
  world.classList.remove('dim');
  world.querySelectorAll('.node').forEach(function(el){ el.setAttribute('aria-expanded','false'); });
}

/* ═══ свободный холст ═══ */
var tx = 0, ty = 0, k = 1;
function clampView(){
  var vw = stage.clientWidth, vh = stage.clientHeight;
  var W = (worldW + 60) * k, H = (worldH + 40) * k;
  var top = headroom();
  /* карта всегда остаётся на экране: по краям можно выйти не больше чем на треть */
  /* сколько карты обязано остаться в видимой области */
  var keepX = Math.min(W, Math.max(300, vw * 0.42));
  var keepY = Math.min(H, Math.max(200, (vh - top) * 0.45));
  tx = Math.max(keepX - W, Math.min(vw - keepX, tx));
  ty = Math.max(top + keepY - H, Math.min(vh - keepY, ty));
}
function minZoom(){
  var vw = stage.clientWidth, vh = stage.clientHeight;
  var f = Math.min((vw - 64) / (worldW + 60), (vh - headroom() - 64) / (worldH + 40));
  return Math.max(0.05, Math.min(0.5, f * 0.85));
}
function apply(){
  clampView();
  world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + k + ')';
  if(openId) placePop(openId);
}
function headroom(){ return document.getElementById('head').offsetHeight + 26; }
function fit(){
  var vw = stage.clientWidth, vh = stage.clientHeight;
  var padL = 30, padT = headroom(), padR = 34, padB = 30;
  k = Math.min((vw - padL - padR) / (worldW + 60), (vh - padT - padB) / (worldH + 40));
  k = Math.max(0.05, Math.min(1, k));
  tx = padL; ty = padT; apply();
}
function zoomAt(cx, cy, nk){
  nk = Math.max(minZoom(), Math.min(3.2, nk));
  tx = cx - (cx - tx) * (nk / k);
  ty = cy - (cy - ty) * (nk / k);
  k = nk; apply();
}
stage.addEventListener('wheel', function(e){
  e.preventDefault();
  if(e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, k * Math.exp(-e.deltaY * 0.012));
  else { tx -= e.deltaX; ty -= e.deltaY; apply(); }
}, {passive:false});

var drag = null;
stage.addEventListener('pointerdown', function(e){
  if(e.target.closest('.node') || e.target.closest('#pop') || e.target.closest('#head')) return;
  drag = {x:e.clientX, y:e.clientY, tx:tx, ty:ty, id:e.pointerId, moved:false};
  stage.setPointerCapture(e.pointerId);
  stage.classList.add('grabbing');
});
stage.addEventListener('pointermove', function(e){
  if(!drag || e.pointerId !== drag.id) return;
  tx = drag.tx + (e.clientX - drag.x);
  ty = drag.ty + (e.clientY - drag.y);
  if(Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 4) drag.moved = true;
  apply();
});
function endDrag(e){
  if(!drag || (e && e.pointerId !== drag.id)) return;
  if(!drag.moved) hidePop();
  drag = null; stage.classList.remove('grabbing');
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

var pts = {}, pinch = null;
stage.addEventListener('pointerdown', function(e){ if(e.pointerType === 'touch') pts[e.pointerId] = e; });
stage.addEventListener('pointermove', function(e){
  if(e.pointerType !== 'touch' || !(e.pointerId in pts)) return;
  pts[e.pointerId] = e;
  var ids = Object.keys(pts);
  if(ids.length !== 2){ pinch = null; return; }
  var a = pts[ids[0]], b = pts[ids[1]];
  var dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  if(!pinch){ pinch = {d:dist, k:k}; return; }
  drag = null;
  zoomAt((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, pinch.k * (dist / pinch.d));
});
function dropPt(e){ delete pts[e.pointerId]; if(Object.keys(pts).length < 2) pinch = null; }
stage.addEventListener('pointerup', dropPt);
stage.addEventListener('pointercancel', dropPt);

/* ═══ события узлов ═══ */
var hoverCapable = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
if(!hoverCapable) document.body.classList.add('touch');
var hideTimer = null;
world.addEventListener('pointerover', function(e){
  if(!hoverCapable) return;
  var b = e.target.closest('.node'); if(!b) return;
  clearTimeout(hideTimer); showPop(b.dataset.id);
});
world.addEventListener('pointerout', function(e){
  if(!hoverCapable || !e.target.closest('.node')) return;
  if(e.relatedTarget && (pop.contains(e.relatedTarget) || e.relatedTarget.closest('.node'))) return;
  hideTimer = setTimeout(hidePop, 220);
});
pop.addEventListener('pointerenter', function(){ clearTimeout(hideTimer); });
pop.addEventListener('pointerleave', function(){ if(hoverCapable) hideTimer = setTimeout(hidePop, 220); });
world.addEventListener('click', function(e){
  var b = e.target.closest('.node'); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  if(openId === b.dataset.id && !hoverCapable) hidePop(); else showPop(b.dataset.id);
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') hidePop();
  if(e.key === '0') fit();
});
window.addEventListener('resize', function(){ hidePop(); apply(); });

render();
fit();
})();
</script>
</body>
</html>
