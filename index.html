<style>
  :root{
    --paper:#eeeeee; --card:#ffffff; --ink:#1c1c1c;
    --ink-70:rgba(28,28,28,.70); --ink-45:rgba(28,28,28,.45);
    --ink-28:rgba(28,28,28,.28); --rule:rgba(28,28,28,.30);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1c1c1c; --card:#262626; --ink:#eeeeee;
      --ink-70:rgba(238,238,238,.70); --ink-45:rgba(238,238,238,.45);
      --ink-28:rgba(238,238,238,.28); --rule:rgba(238,238,238,.32);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1c1c1c; --card:#262626; --ink:#eeeeee;
    --ink-70:rgba(238,238,238,.70); --ink-45:rgba(238,238,238,.45);
    --ink-28:rgba(238,238,238,.28); --rule:rgba(238,238,238,.32);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"EB Garamond",Georgia,"Times New Roman",serif;
    font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }

  #stage{
    position:fixed;inset:0;overflow:hidden;
    cursor:grab;touch-action:none;
  }
  #stage.grabbing{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #world svg.lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  #world svg.lines path{fill:none;stroke:var(--rule);stroke-width:1.2}
  #world svg.lines path.hedge{stroke-dasharray:3 5}

  .ttl{
    position:absolute;white-space:nowrap;pointer-events:none;
    font-size:62px;line-height:1;color:var(--ink-28);letter-spacing:.02em;
  }
  .ttl i{display:block;font-size:14px;font-style:normal;letter-spacing:.16em;
    text-transform:uppercase;margin-top:12px;color:var(--ink-28)}

  .node{
    position:absolute;display:flex;align-items:center;gap:11px;
    background:none;border:0;padding:0;margin:0;cursor:pointer;
    color:var(--ink);font-family:inherit;text-align:left;
  }
  .node:focus{outline:none}
  .node .gl{flex:0 0 auto;display:flex;align-items:center;justify-content:center;line-height:1}
  .node .gl.none::after{content:"";display:block;width:62%;height:1px;background:var(--rule)}
  .node .gl svg{display:block;width:100%;height:100%}
  .node .gl svg path{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .node .tx{min-width:0;flex:1 1 auto}
  .node .nm{display:block;line-height:1.14;font-size:15px}
  .node .dt{display:block;color:var(--ink-45);line-height:1.2;margin-top:2px;font-size:11px}
  .node:hover .nm,.node[aria-expanded="true"] .nm{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
  #world.dim .node:not([aria-expanded="true"]){opacity:.4}

  #head{
    position:fixed;left:26px;top:24px;z-index:20;max-width:33ch;pointer-events:none;
  }
  #head h1{font-weight:400;font-size:25px;line-height:1.1;margin:0 0 6px}
  #head p{margin:0;color:var(--ink-45);font-size:14.5px;line-height:1.42}
  #head a{pointer-events:auto;color:var(--ink-70);text-decoration:underline;text-underline-offset:3px}
  @media (max-width:700px){ #head{left:14px;top:12px;max-width:none;right:14px} #head h1{font-size:20px} }

  #pop{
    position:fixed;z-index:40;display:none;
    width:368px;max-width:calc(100vw - 28px);
    max-height:calc(100vh - 28px);overflow-y:auto;
    background:var(--card);padding:20px 24px 22px;
    scrollbar-width:thin;scrollbar-color:var(--ink-28) transparent;
  }
  #pop.on{display:block}
  #pop .pg{height:74px;margin-bottom:12px;display:flex;align-items:flex-end;line-height:1}
  #pop .pg svg{display:block;height:100%;width:74px}
  #pop .pg svg path{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  #pop .pt{font-size:21px;line-height:1.2;margin:0 0 2px}
  #pop .pl{font-size:16px;line-height:1.2;margin:0 0 7px;color:var(--ink-70);font-style:italic}
  #pop .pm{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-45);margin:0 0 11px}
  #pop .pd{font-size:16px;line-height:1.5;color:var(--ink-70);margin:0}
  #pop .pd + .pd{margin-top:9px}
  #pop .pu{font-size:13px;letter-spacing:.04em;color:var(--ink-45);margin:11px 0 0;font-variant-numeric:tabular-nums}
  #pop .ps{margin:13px 0 0;font-size:14px}
  #pop .ps a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;display:inline-block;margin-right:14px}
  #pop .pclose{margin-top:14px;background:none;border:0;padding:0;font-family:inherit;font-size:14px;color:var(--ink-45);text-decoration:underline;text-underline-offset:3px;cursor:pointer;display:none}
  body.touch #pop .pclose{display:block}

  .f-cun{font-family:"Noto Sans Cuneiform",serif}
  .f-egy{font-family:"Noto Sans Egyptian Hieroglyphs",serif}
  .f-uga{font-family:"Noto Sans Ugaritic",serif}
  .f-phn{font-family:"Noto Sans Phoenician",serif}
  .f-osa{font-family:"Noto Sans Old South Arabian",serif}
  .f-eth{font-family:"Noto Sans Ethiopic",serif}
  .f-sam{font-family:"Noto Sans Samaritan",serif}
  .f-ara{font-family:"Noto Sans Imperial Aramaic",serif}
  .f-heb{font-family:"Noto Sans Hebrew",serif}
  .f-nab{font-family:"Noto Sans Nabataean",serif}
  .f-arb{font-family:"Noto Sans Arabic",serif}
  .f-pal{font-family:"Noto Sans Palmyrene",serif}
  .f-syr{font-family:"Noto Sans Syriac",serif}
  .f-man{font-family:"Noto Sans Mandaic",serif}
  .f-sog{font-family:"Noto Sans Sogdian",serif}
  .f-uyg{font-family:"Noto Serif Old Uyghur",serif}
  .f-mon{font-family:"Noto Sans Mongolian",serif}
  .f-ita{font-family:"Noto Sans Old Italic",serif}
  .f-cop{font-family:"Noto Sans Coptic",serif}
  .f-got{font-family:"Noto Sans Gothic",serif}
  .f-gla{font-family:"Noto Sans Glagolitic",serif}
  .f-arm{font-family:"Noto Sans Armenian",serif}
  .f-geo{font-family:"Noto Sans Georgian",serif}
  .f-lat{font-family:"EB Garamond",Georgia,serif}
</style>
</head>
<body>

<div id="stage"><div id="world"></div></div>

<script>
(function(){
"use strict";

/* ═══ язык: регион, затем язык браузера. Переключателя нет, но ?lang= работает ═══ */
function pickLang(){
  var q = (location.search.match(/[?&]lang=(ru|en)/) || [])[1];
  if(q) return q;
  var tz = '';
  try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
  var RU = /^(Europe\/(Moscow|Kaliningrad|Samara|Volgograd|Saratov|Astrakhan|Ulyanovsk|Kirov|Minsk)|Asia\/(Yekaterinburg|Omsk|Novosibirsk|Barnaul|Tomsk|Novokuznetsk|Krasnoyarsk|Irkutsk|Chita|Yakutsk|Khandyga|Vladivostok|Ust-Nera|Magadan|Sakhalin|Srednekolymsk|Kamchatka|Anadyr|Almaty|Bishkek|Tashkent))$/;
  if(RU.test(tz)) return 'ru';
  var langs = (navigator.languages || [navigator.language || '']).join(',').toLowerCase();
  if(/\b(ru|be|kk|ky)(-|,|$)/.test(langs)) return 'ru';
  return 'en';
}
var LANG = pickLang();
document.documentElement.lang = LANG;
function T(pair){ return !pair ? '' : (LANG === 'ru' ? pair[0] : pair[1]); }

var UI = {
  title:['Карта букв','Letter Map'],
  sub:['Три первые буквы алфавита — ʾалеф, бет, гимель — и всё, во что они превратились. Слева древнее, справа сегодняшнее.',
       'The first three letters of the alphabet — ʾaleph, beth, gimel — and everything they turned into. Oldest on the left, today on the right.'],
  hint:['Тяните карту, щипок — масштаб. Наведите на узел. Клавиша 0 — вернуть обзор.',
        'Drag to pan, pinch to zoom. Hover a node. Press 0 to fit.'],
  links:['<a href="latin.html">Латиница по этапам</a> · <a href="scripts.html">Дерево письменностей</a>',
         '<a href="latin.html">Latin, stage by stage</a> · <a href="scripts.html">Tree of scripts</a>'],
  close:['закрыть','close'],
  today:['Сегодня','Today'],
  noUni:['знака нет: блока в Юникоде нет','no sign: no Unicode block'],
  letters:[['ʾАЛЕФ','БЫК','ʾALEPH','OX'],['БЕТ','ДОМ','BETH','HOUSE'],['ГИМЕЛЬ','МЕТАТЕЛЬНАЯ ПАЛКА','GIMEL','THROWSTICK']]
};

var OX = ["M34 46 L66 46","M34 46 L50 84 L66 46","M34 46 C22 40 14 26 18 13","M66 46 C78 40 86 26 82 13"];
function svgOx(){ return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
  OX.map(function(p){ return '<path d="'+p+'"/>'; }).join('') + '</svg>'; }

var W = function(slug, ru, en){ return [[ru||('Wikipedia: '+slug.replace(/_/g,' ')), en||('Wikipedia: '+slug.replace(/_/g,' '))],
       'https://en.wikipedia.org/wiki/'+slug]; };
var UC = function(hex){ return [['Unicode '+hex,'Unicode '+hex], 'https://www.unicode.org/charts/PDF/U'+hex+'.pdf']; };

/* ═══ письменности: описание пишется один раз на все три буквы ═══ */
var SC = {
 cun:{n:['Клинопись','Cuneiform'], d:['с конца IV тыс. до н. э.','from the late 4th mill. BCE'],
   m:['Шумер, Месопотамия','Sumer, Mesopotamia'],
   x:[['Древнейшее известное письмо. Алфавиту оно НЕ предок: в справочнике у клинописи прямо указано «дочерних систем нет; повлияла на форму знаков угаритского и древнеперсидского».',
       'The earliest known writing. It is NOT an ancestor of the alphabet: the reference states flatly that cuneiform has "no child systems; influenced the shape of Ugaritic and Old Persian glyphs".'],
      ['Единственная ниточка к нашему дереву — осторожное предположение, что шумерское протописьмо повлияло на появление египетской иероглифики: она «возникла немного позже и, вероятно, была изобретена под его влиянием». Определённого вывода о происхождении иероглифики нет. Поэтому на карте эта связь показана пунктиром.',
       'The one thread to our tree is a hedged suggestion that Sumerian proto-writing influenced the rise of Egyptian hieroglyphs: they "came into existence a little after [Sumerian script], and, probably, [were] invented under the influence of the latter". No definitive determination has been made. Hence the dotted line on this map.']],
   u:'U+12000–U+123FF', s:[W('Cuneiform'), UC('12000')]},

 egy:{n:['Египетская иероглифика','Egyptian hieroglyphs'], d:['с XXXII в. до н. э.','from the 32nd c. BCE'],
   m:['Египет','Egypt'],
   x:[['Алфавит родился из неё не прямым наследованием, а трюком: несколько знаков взяли ради ПЕРВОГО звука их египетского названия, забыв про смысл рисунка.',
       'The alphabet came out of it not by inheritance but by a trick: a few signs were taken for the FIRST sound of their Egyptian name, dropping what the picture meant.']],
   u:'U+13000–U+1342F', s:[W('Egyptian_hieroglyphs'), UC('13000')]},

 psin:{n:['Протосинайское письмо','Proto-Sinaitic script'], d:['XIX–XVI вв. до н. э.','19th–16th c. BCE'],
   m:['Синай, Серабит-эль-Хадим','Sinai, Serabit el-Khadim'],
   x:[['Корень всего дерева: бирюзовые копи на Синае и Вади-эль-Холь в Среднем Египте. Датировка спорна — ранняя около 1850 г. до н. э., поздняя около 1550 г. до н. э.',
       'The root of the whole tree: turquoise mines in Sinai and Wadi el-Hol in Middle Egypt. The dating is disputed — an early date around 1850 BCE, a late one around 1550 BCE.'],
      ['В Юникод не входит, заявка L2/19-299 ещё обсуждается. Знаки нарисованы контуром по прорисовкам из источника; в разных надписях они расходятся сильно.',
       'Not in Unicode; proposal L2/19-299 is still under discussion. The signs here are drawn from the published tracings, and they vary a lot between inscriptions.']],
   u:'', s:[W('Proto-Sinaitic_script'), [['Unicode L2/19-299','Unicode L2/19-299'],'https://www.unicode.org/L2/L2019/19299-revisiting-proto-sinaitic.pdf']]},

 ugar:{n:['Угаритский алфавит','Ugaritic alphabet'], d:['ок. 1400–1190 до н. э.','c. 1400–1190 BCE'],
   m:['Угарит, Рас-Шамра, Сирия','Ugarit, Ras Shamra, Syria'],
   x:[['Вот она, связь с клинописью. Это настоящий алфавит из 30 букв, но выдавленный клином по глине. «То, что угаритское письмо клинописное и что направление письма у него то же, что у других клинописных систем, поддерживает гипотезу, что оно было напрямую вдохновлено клинописной системой вроде аккадской».',
       'Here is the link to cuneiform. A real 30-letter alphabet, but pressed into clay with a wedge stylus. "The facts that the Ugaritic alphabet is written in cuneiform and that it has been found to overwhelmingly follow the same writing direction as other cuneiform systems both support the hypothesis that Ugaritic was directly inspired by a cuneiform system such as Akkadian cuneiform."'],
      ['Финикийскому оно не предок, а двоюродный брат: обе ветви идут от протосинайского, и обе отметки стоят со знаком вопроса. Зато именно угаритские абецедарии дают «древнейшее прямое свидетельство не только порядка „abc“, но и порядка „hlḥm“» — то есть обоих алфавитных порядков сразу.',
       'It is not an ancestor of Phoenician but a cousin: both branch off Proto-Sinaitic, and both links carry a question mark. What Ugarit does give is the abecedaries — "the earliest direct evidence of not just the ‘abc’ alphabetical order but also the ‘hlḥm’ order", both at once.'],
      ['Осторожность источника стоит повторить: «из-за простой и крайне абстрактной природы угаритских знаков легко найти графические сходства с многими другими письменностями того времени».',
       'The source’s own caution is worth repeating: "due to the simple and highly abstract nature of Ugaritic characters, it is easy to find graphical similarities and phonological matches with many other scripts of the time."']],
   u:'U+10380–U+1039F', s:[W('Ugaritic_alphabet'), UC('10380')]},

 phn:{n:['Финикийское письмо','Phoenician alphabet'], d:['XII в. до н. э.','12th c. BCE'],
   m:['Финикия','Phoenicia'],
   x:[['22 согласных знака, справа налево, гласных нет вовсе. Главная развилка: отсюда уходят арамейская и греческая ветви, а с ними почти всё остальное.',
       'Twenty-two consonant signs, right to left, no vowels at all. The great fork: the Aramaic and Greek branches leave from here, and with them nearly everything else.']],
   u:'U+10900–U+1091F', s:[W('Phoenician_alphabet'), UC('10900')]},

 osa:{n:['Древнеюжноаравийское','Ancient South Arabian'], d:['конец II тыс. до н. э.','late 2nd mill. BCE'],
   m:['Йемен','Yemen'],
   x:[['Не потомок финикийского, а его брат: «отделилось от протосинайского письма примерно в конце II тысячелетия до н. э.» и названо «сестринским письмом финикийского алфавита».',
       'Not a descendant of Phoenician but its sibling: it "branched from the Proto-Sinaitic script in about the late 2nd millennium BCE" and is called "a sibling script of the Phoenician alphabet".'],
      ['Важно для этой карты: здесь другой алфавитный порядок — halaḥam, а не abgd. Поэтому ʾалеф, бет и гимель тут не первые три буквы, а просто буквы.',
       'Important here: this branch uses a different alphabetical order — halaḥam, not abgd. So ʾaleph, beth and gimel are not its first three letters, just letters.']],
   u:'U+10A60–U+10A7F', s:[W('Ancient_South_Arabian_script'), UC('10A60')]},

 geez:{n:['Эфиопское письмо (геэз)','Geʽez script'], d:['с I в. н. э.','from the 1st c. CE'],
   m:['Эфиопия и Эритрея','Ethiopia and Eritrea'],
   x:[['«Единственное сохранившееся письмо, происходящее от древнеюжноаравийского». Около IV века превратилось из консонантного в слоговое — редчайший случай смены типа письма на ходу.',
       '"The sole extant writing system that derives from ASA." Around the 4th century it turned from an abjad into a syllabary — a very rare change of type in mid-life.']],
   u:'U+1200–U+137F', s:[W('Ge%CA%BDez_script'), UC('1200')]},

 paleo:{n:['Палеоеврейское письмо','Paleo-Hebrew'], d:['X в. до н. э. — 135 г.','10th c. BCE – 135 CE'],
   m:['Древний Израиль','Ancient Israel'],
   x:[['«Первоначальный еврейский алфавит, выведенный напрямую из финикийского». Юникод не дал ему своего блока — кодируется финикийским, поэтому знак тот же.',
       '"The original Hebrew alphabet derived directly from the Phoenician alphabet." Unicode gave it no block of its own — it is encoded as Phoenician, so the sign shown is the same.']],
   u:'', s:[W('Paleo-Hebrew_alphabet')]},

 sam:{n:['Самаритянское письмо','Samaritan script'], d:['с VI в. до н. э.','from the 6th c. BCE'],
   m:['Самаряне','Samaritans'],
   x:[['Потомок палеоеврейского, а не арамейского: самаряне сохранили ту форму букв, от которой евреи отказались.',
       'A descendant of Paleo-Hebrew, not of Aramaic: the Samaritans kept the letter shapes the Jews gave up.']],
   u:'U+0800–U+083F', s:[W('Samaritan_script'), UC('0800')]},

 aram:{n:['Арамейское письмо','Aramaic alphabet'], d:['VIII в. до н. э.','8th c. BCE'],
   m:['Арамеи, затем держава Ахеменидов','Arameans, then the Achaemenid Empire'],
   x:[['«Древнейшие надписи на арамейском языке сделаны финикийским алфавитом. Со временем он развился в арамейский алфавит — к VIII веку до н. э.»',
       '"The earliest inscriptions in the Aramaic language use the Phoenician alphabet. Over time, the alphabet developed into the Aramaic alphabet by the 8th century BC."'],
      ['Канцелярское письмо персидской державы разнесло его от Египта до Индии. Второй по важности узел дерева после финикийского.',
       'As the chancery script of the Persian empire it travelled from Egypt to India. The second most important node on this map after Phoenician.']],
   u:'U+10840–U+1085F', s:[W('Aramaic_alphabet'), UC('10840')]},

 heb:{n:['Еврейское квадратное письмо','Hebrew square script'], d:['III–I вв. до н. э.','3rd–1st c. BCE'],
   m:['Евреи','Jews'],
   x:[['«Стилизованная форма арамейского алфавита», вытеснившая палеоеврейское письмо. Даты в источниках расходятся: II–I вв. до н. э., 135 г. н. э. или III в. до н. э.',
       '"A stylized form of the Aramaic alphabet", which displaced Paleo-Hebrew. The sources disagree on the date: 2nd–1st c. BCE, 135 CE, or 3rd c. BCE.']],
   u:'U+0590–U+05FF', s:[W('Hebrew_alphabet'), UC('0590')]},

 nab:{n:['Набатейское письмо','Nabataean script'], d:['II в. до н. э. — IV в. н. э.','2nd c. BCE – 4th c. CE'],
   m:['Петра, Мадаин-Салих','Petra, Mada’in Saleh'],

 ['ugar', 'psin','𐎂','f-uga',['gamla','gamla'], null],
 ['phn',  'psin','𐤂','f-phn',['gīml','gīml'], [
   'Звонкий заднеязычный /g/. Числовое значение — 3.',
   'The voiced velar /g/. Its numeric value is 3.']],
 ['osa',  'psin','𐩴','f-osa',['gīml','gīml'], null],
 ['geez', 'osa', 'ገ','f-eth', ['gäml','gäml'], null],
 ['paleo','phn', '𐤂','f-phn',['gimel','gimel'], null],
 ['sam',  'paleo','ࠂ','f-sam',['gaman','gaman'], null],
 ['aram', 'phn', '𐡂','f-ara',['gāmal','gāmal'], null],
 ['heb',  'aram','ג','f-heb', ['gimel','gimel'], null],
 ['nab',  'aram','𐢄','f-nab',['gīmel','gīmel'], null],
 ['arab', 'nab', 'ج','f-arb', ['jīm','jīm'], [
   'В старом абджадном порядке джим стоит третьей, как и гимель. В нынешнем арабском порядке она сдвинулась на пятое место.',
   'In the old abjadī order jīm stands third, just like gimel. In the modern Arabic order it has moved to fifth place.']],
 ['palm', 'aram','𐡢','f-pal',['gāmal','gāmal'], null],
 ['syr',  'palm','ܓ','f-syr', ['gāmal','gāmal'], null],
 ['mand', 'aram','ࡂ','f-man', ['ag','ag'], null],
 ['grk',  'phn', 'Γ','f-lat', ['гамма','gamma'], [
   '«В архаической Греции форма гаммы была ближе к классической лямбде (Λ), тогда как лямбда сохраняла финикийскую L-образную форму» — какое-то время они выглядели наоборот.',
   '"In Archaic Greece, the shape of gamma was closer to a classical lambda (Λ), while lambda retained the Phoenician L-shape" — for a while the two looked swapped.']],
 ['etr',  'grk', '𐌂','f-ita',['ke','ke'], [
   'В этрусском не было противопоставления по звонкости, поэтому греческую гамму со звуком /g/ приспособили под /k/. Отсюда вся дальнейшая путаница латинской C.',
   'Etruscan had no voicing contrast, so Greek gamma with its /g/ was repurposed for /k/. All the later confusion around Latin C starts here.']],
 ['lat',  'etr', 'C','f-lat', ['C c · G g','C c · G g'], [
   'Одна буква C веками обслуживала и /k/, и /g/. Около 230 г. до н. э. к ней добавили штрих и получили G, поставив новую букву на седьмое место — туда, где раньше стояла выброшенная Z.',
   'A single letter C served both /k/ and /g/ for centuries. Around 230 BCE a stroke was added to it to make G, and the new letter took seventh place — the slot of the discarded Z.']],
 ['copt', 'grk', 'Ⲅ','f-cop', ['гамма','gamma'], null],
 ['goth', 'grk', '𐌲','f-got',['giba','giba'], null],
 ['glag', 'grk', 'Ⰳ','f-gla', ['глаголи','glagoli'], [
   'В глаголице и кириллице этот знак стоит четвёртым, а не третьим: перед ним вклинилась добавленная буква буки/Б.',
   'In Glagolitic and Cyrillic this sign stands fourth, not third: the added letter buky/Б was wedged in before it.']],

 ['arm',  'grk', 'Գ','f-arm', ['гим','gim'], null],
 ['geo',  'grk', 'გ','f-geo', ['ган','gan'], null]
]);

var TREES = [{k:0, nodes:ALEPH}, {k:1, nodes:BETH}, {k:2, nodes:GIMEL}];

/* ═══ раскладка ═══ */
var COLP = 232, ROWH = 56, NODEW = 182, GAPY = 170;
var all = [], lines = [], titles = [], worldW = 0, worldH = 96;

TREES.forEach(function(T, ti){
  var ns = T.nodes, byId = {}, kids = {};
  ns.forEach(function(n){ n.id = ti + ':' + n.sc; byId[n.sc] = n; kids[n.sc] = []; });
  ns.forEach(function(n){ if(n.p && byId[n.p]) kids[n.p].push(n); });
  ns.forEach(function(n){
    var c = 0, cur = n;
    while(cur.p && byId[cur.p]){ cur = byId[cur.p]; c++; }
    n.col = c;
  });
  var lane = 0;
  (function walk(n){
    var ch = kids[n.sc];
    if(!ch.length){ n.row = lane++; return; }
    ch.forEach(walk);
    n.row = (ch[0].row + ch[ch.length - 1].row) / 2;
  })(ns[0]);

  var baseY = worldH;
  ns.forEach(function(n){
    n.x = n.col * COLP;
    n.y = baseY + n.row * ROWH + ROWH / 2;
    n.tree = T;
    all.push(n);
    worldW = Math.max(worldW, n.x + NODEW);
  });
  ns.forEach(function(n){
    if(!n.p || !byId[n.p]) return;
    var a = byId[n.p];
    lines.push({sx:a.x + NODEW - 6, sy:a.y, ex:n.x - 10, ey:n.y, hedge:(n.sc === 'egy')});
  });
  var l = UI.letters[ti];
  titles.push({x:0, y:baseY - 74, big: LANG === 'ru' ? l[0] : l[2], small: LANG === 'ru' ? l[1] : l[3]});
  worldH = baseY + lane * ROWH + GAPY;
});

/* ═══ отрисовка ═══ */
var world = document.getElementById('world');
var stage = document.getElementById('stage');
var pop = document.getElementById('pop');
var openId = null, byKey = {};

document.getElementById('head').innerHTML =
  '<h1>' + T(UI.title) + '</h1><p>' + T(UI.sub) + '</p>' +
  '<p style="margin-top:7px">' + T(UI.hint) + '</p>' +
  '<p style="margin-top:7px">' + T(UI.links) + '</p>';

(function draw(){
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('class', 'lines');
  svg.setAttribute('width', worldW + 40);
  svg.setAttribute('height', worldH + 40);
  var d = '', dh = '';
  lines.forEach(function(e){
    var mx = (e.sx + e.ex) / 2;
    var seg = (Math.abs(e.sy - e.ey) < 1)
      ? 'M' + e.sx + ' ' + e.sy + 'L' + e.ex + ' ' + e.ey
      : 'M' + e.sx + ' ' + e.sy + 'C' + mx + ' ' + e.sy + ',' + mx + ' ' + e.ey + ',' + e.ex + ' ' + e.ey;
    if(e.hedge) dh += seg; else d += seg;
  });
  svg.innerHTML = '<path d="' + d + '"/><path class="hedge" d="' + dh + '"/>';
  world.appendChild(svg);

  titles.forEach(function(t){
    var el = document.createElement('div');
    el.className = 'ttl';
    el.style.left = t.x + 'px'; el.style.top = t.y + 'px';
    el.innerHTML = t.big + '<i>' + t.small + '</i>';
    world.appendChild(el);
  });

  all.forEach(function(n){
    var s = SC[n.sc];
    var b = document.createElement('button');
    b.className = 'node'; b.type = 'button';
    b.setAttribute('aria-expanded', 'false');
    b.setAttribute('aria-label', T(s.n));
    b.dataset.id = n.id;
    b.style.left = n.x + 'px'; b.style.top = (n.y - ROWH / 2) + 'px';
    b.style.width = NODEW + 'px'; b.style.height = ROWH + 'px';
    var g = n.g === 'ox' ? '<span class="gl" style="width:34px;height:34px">' + svgOx() + '</span>'
          : n.g ? '<span class="gl ' + n.g[1] + '" style="width:34px;height:34px;font-size:34px">' + n.g[0] + '</span>'
                : '<span class="gl none" style="width:34px;height:34px"></span>';
    b.innerHTML = g + '<span class="tx"><span class="nm">' + T(s.n) + '</span>' +
                  '<span class="dt">' + T(n.ln) + ' · ' + T(s.d) + '</span></span>';
    world.appendChild(b);
    n._el = b;
    byKey[n.id] = n;
  });
})();

/* ═══ карточка ═══ */
function popHTML(n){
  var s = SC[n.sc];
  var h = '<div class="pg">';
  if(n.g === 'ox') h += svgOx();
  else if(n.g)     h += '<span class="' + n.g[1] + '" style="font-size:66px;line-height:1">' + n.g[0] + '</span>';
  else             h += '<span style="font-size:14px;color:var(--ink-45);line-height:1.3">' + T(UI.noUni) + '</span>';
  h += '</div>';
  h += '<p class="pt">' + T(s.n) + '</p>';
  h += '<p class="pl">' + T(n.ln) + '</p>';
  h += '<p class="pm">' + T(s.m) + ' · ' + T(s.d) + '</p>';
  if(n.note) h += '<p class="pd">' + T(n.note) + '</p>';
  s.x.forEach(function(x){ h += '<p class="pd">' + T(x) + '</p>'; });
  if(s.u) h += '<p class="pu">' + s.u + '</p>';
  h += '<p class="ps">' + s.s.map(function(x){
         var ext = /^https?:/.test(x[1]) ? ' target="_blank" rel="noopener"' : '';
         return '<a href="' + x[1] + '"' + ext + '>' + T(x[0]) + '</a>';
       }).join('') + '</p>';
  h += '<button class="pclose" type="button">' + T(UI.close) + '</button>';
  return h;
}
function placePop(n){
  if(!n || !pop.classList.contains('on')) return;
  var r = n._el.getBoundingClientRect();
  var vw = document.documentElement.clientWidth, vh = window.innerHeight;
  var pw = pop.offsetWidth, ph = pop.offsetHeight;
  var left = r.right + 16;
  if(left + pw > vw - 14) left = r.left - pw - 16;
  if(left < 14) left = Math.max(14, Math.min(vw - pw - 14, r.left));
  var top = r.top - 14;
  if(top + ph > vh - 14) top = vh - ph - 14;
  if(top < 12) top = 12;
  pop.style.left = Math.round(left) + 'px';
  pop.style.top = Math.round(top) + 'px';
}
function showPop(id){
  var n = byKey[id]; if(!n) return;
  openId = id;
  pop.innerHTML = popHTML(n);
  pop.classList.add('on');
  pop.querySelector('.pclose').addEventListener('click', hidePop);
  world.classList.add('dim');
  world.querySelectorAll('.node').forEach(function(el){
    el.setAttribute('aria-expanded', el.dataset.id === id ? 'true' : 'false');
  });
  placePop(n);
}
function hidePop(){
  openId = null;
  pop.classList.remove('on'); pop.innerHTML = '';
  world.classList.remove('dim');
  world.querySelectorAll('.node').forEach(function(el){ el.setAttribute('aria-expanded','false'); });
}

/* ═══ свободный холст ═══ */
var tx = 0, ty = 0, k = 1;
function apply(){
  world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + k + ')';
  if(openId) placePop(byKey[openId]);
}
function headroom(){ return document.documentElement.clientWidth < 700 ? 196 : 182; }
function fit(){                                   /* клавиша 0 — весь обзор */
  var vw = stage.clientWidth, vh = stage.clientHeight;
  var padL = 30, padT = headroom(), padR = 34, padB = 34;
  k = Math.min((vw - padL - padR) / (worldW + 40), (vh - padT - padB) / (worldH + 40));
  k = Math.max(0.06, Math.min(1, k));
  tx = padL; ty = padT;
  apply();
}
function home(){                                  /* стартовый вид — читаемый */
  var vw = stage.clientWidth;
  k = vw < 700 ? 0.62 : 0.84;
  tx = vw < 700 ? 14 : 40;
  ty = headroom();
  apply();
}
function zoomAt(cx, cy, nk){
  nk = Math.max(0.08, Math.min(4, nk));
  tx = cx - (cx - tx) * (nk / k);
  ty = cy - (cy - ty) * (nk / k);
  k = nk; apply();
}

stage.addEventListener('wheel', function(e){
  e.preventDefault();
  if(e.ctrlKey || e.metaKey){
    zoomAt(e.clientX, e.clientY, k * Math.exp(-e.deltaY * 0.012));
  }else{
    tx -= e.deltaX; ty -= e.deltaY; apply();
  }
}, {passive:false});

var drag = null;
stage.addEventListener('pointerdown', function(e){
  if(e.target.closest('.node') || e.target.closest('#pop')) return;
  if(e.pointerType === 'touch' && e.isPrimary === false) return;
  drag = {x:e.clientX, y:e.clientY, tx:tx, ty:ty, id:e.pointerId, moved:false};
  stage.setPointerCapture(e.pointerId);
  stage.classList.add('grabbing');
});
stage.addEventListener('pointermove', function(e){
  if(!drag || e.pointerId !== drag.id) return;
  tx = drag.tx + (e.clientX - drag.x);
  ty = drag.ty + (e.clientY - drag.y);
  if(Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 4) drag.moved = true;
  apply();
});
function endDrag(e){
  if(!drag || (e && e.pointerId !== drag.id)) return;
  if(!drag.moved) hidePop();
  drag = null;
  stage.classList.remove('grabbing');
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

/* щипок на экране */
var pts = {}, pinch = null;
stage.addEventListener('pointerdown', function(e){ if(e.pointerType === 'touch') pts[e.pointerId] = e; });
stage.addEventListener('pointermove', function(e){
  if(e.pointerType !== 'touch') return;
  if(!(e.pointerId in pts)) return;
  pts[e.pointerId] = e;
  var ids = Object.keys(pts);
  if(ids.length !== 2){ pinch = null; return; }
  var a = pts[ids[0]], b = pts[ids[1]];
  var dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  var cx = (a.clientX + b.clientX) / 2, cy = (a.clientY + b.clientY) / 2;
  if(!pinch){ pinch = {d:dist, k:k}; return; }
  drag = null;
  zoomAt(cx, cy, pinch.k * (dist / pinch.d));
});
function dropPt(e){ delete pts[e.pointerId]; if(Object.keys(pts).length < 2) pinch = null; }
stage.addEventListener('pointerup', dropPt);
stage.addEventListener('pointercancel', dropPt);

/* ═══ события узлов ═══ */
var hoverCapable = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
if(!hoverCapable) document.body.classList.add('touch');
var hideTimer = null;

world.addEventListener('pointerover', function(e){
  if(!hoverCapable) return;
  var b = e.target.closest('.node'); if(!b) return;
  clearTimeout(hideTimer); showPop(b.dataset.id);
});
world.addEventListener('pointerout', function(e){
  if(!hoverCapable) return;
  if(!e.target.closest('.node')) return;
  if(e.relatedTarget && (pop.contains(e.relatedTarget) || e.relatedTarget.closest('.node'))) return;
  hideTimer = setTimeout(hidePop, 220);
});
pop.addEventListener('pointerenter', function(){ clearTimeout(hideTimer); });
pop.addEventListener('pointerleave', function(){ if(hoverCapable) hideTimer = setTimeout(hidePop, 220); });
world.addEventListener('click', function(e){
  var b = e.target.closest('.node'); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  if(openId === b.dataset.id && !hoverCapable) hidePop(); else showPop(b.dataset.id);
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') hidePop();
  if(e.key === '0'){ fit(); }
});
window.addEventListener('resize', function(){ hidePop(); apply(); });

home();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ /* шрифты не меняют раскладку */ });
})();
</script>
</body>
